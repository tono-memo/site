# 一个 app 一个文件：文件名即 URL 段（/liubai）。
# 新增 app 只需在此目录再放一个 yaml，首页列表和产品页会自动出现，不用改任何代码。
order: 1

# 字标不翻译：中文字标是品牌资产，英文页同样沿用，下方以拉丁名注解
name: 留白
latinName: LiuBai

# 页面配色：warm 为暖白底
theme: warm
version: "1.0"
updated: 2026-08-29

# 上架后填入链接，按钮会自动从「即将上线」变成可点击的 App Store
appStoreUrl: https://apps.apple.com/app/id6794540351

# 创建公开测试链接后填入 https://testflight.apple.com/join/XXXXXXXX
testFlightUrl: https://testflight.apple.com/join/RxvjfM4U

operatingSystem: iOS, iPadOS

# 来自 App Store 的官方截图；路径相对于 public/。
screenshots:
  - image: products/liubai/home.webp
    alt:
      zh-CN: 留白首页，展示随笔卡片和日历入口
      en: LiuBai home screen with note cards and calendar access
  - image: products/liubai/daily-prompt.webp
    alt:
      zh-CN: 每日一问写作界面
      en: Daily prompt writing screen
  - image: products/liubai/photo-note.webp
    alt:
      zh-CN: 照片札记界面
      en: Photo note screen
  - image: products/liubai/voice-note.webp
    alt:
      zh-CN: 语音片段记录界面
      en: Voice note recording screen

copy:
  zh-CN:
    titleSuffix: 随笔记录
    tagline: 在空白处，写下你的灵感
    description: 留白是一款安静记录灵感的随笔应用。本地优先；未开启 iCloud 仍可在设备上使用，开启后文字、照片与录音通过你的私人 iCloud 同步。不含广告与追踪。
    features:
      - 随笔记录
      - 照片与录音
      - 私人 iCloud 同步
    availabilityNote: App Store 暂不支持中国大陆地区
  en:
    titleSuffix: Notes & Ideas
    tagline: Write your ideas in the blank space
    description: LiuBai is a quiet, local-first notes app. It works on-device without iCloud; when enabled, your words, photos, and recordings sync through your private iCloud. No ads or tracking.
    features:
      - Notes & ideas
      - Photos & recordings
      - Private iCloud sync
    availabilityNote: Not currently available in mainland China
